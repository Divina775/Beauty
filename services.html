<script>
const lang = initChrome();

const savedCart = Cart.read();
// drop any saved selection that no longer matches a real service — the catalog can
// change over time, and a stale entry here would otherwise silently break rendering
let selected = (savedCart.selected || []).filter(sel=>{
  const s = SERVICES.find(x=>x.id===sel.serviceId);
  return !!(s && s.options[sel.optionIndex]);
});
let activeCat = 'All';
let selectedTime = savedCart.time;

function persistCart(){
  Cart.write({ selected, date: document.getElementById('apptDate').value, time: selectedTime });
}

/* ---------------- CATEGORY TABS ---------------- */
function renderTabs(){
  const tabsEl = document.getElementById('catTabs');
  const cats = categories(lang);
  const allLabel = lang==='en' ? 'All' : 'Tout';
  const all = [allLabel, ...cats];
  tabsEl.innerHTML = all.map(c =>
    `<button class="cat-tab ${(c===activeCat || (activeCat==='All' && c===allLabel)) ? 'active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  tabsEl.querySelectorAll('.cat-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.cat;
      activeCat = (val===allLabel) ? 'All' : val;
      renderTabs();
      renderServices();
    });
  });
}

/* ---------------- SERVICE LIST ---------------- */
function isSelected(serviceId, optIdx){
  return selected.some(x => x.serviceId===serviceId && x.optionIndex===optIdx);
}

function renderServices(){
  const groupsEl = document.getElementById('serviceGroups');
  const cats = activeCat === 'All' ? categories(lang) : [activeCat];
  groupsEl.innerHTML = cats.map(cat => {
    const items = SERVICES.filter(s => s.cat[lang] === cat);
    return `
      <div class="service-group">
        <h3>${cat}</h3>
        <div class="group-sub">${items.length} ${items.length>1?'services':'service'}</div>
        ${items.map(s => renderServiceCard(s)).join('')}
      </div>
    `;
  }).join('');

  groupsEl.querySelectorAll('.add-btn[data-single]').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleOption(btn.dataset.id, 0));
  });
  groupsEl.querySelectorAll('.option-row').forEach(row=>{
    row.addEventListener('click', ()=> toggleOption(row.dataset.id, parseInt(row.dataset.opt,10)));
  });
}

function renderServiceCard(s){
  const single = s.options.length === 1 && !s.options[0].label;
  const notes = s.notes[lang] || [];
  const notesHtml = notes.length ? `<ul class="service-notes">${notes.map(n=>`<li>${n}</li>`).join('')}</ul>` : '';
  const descHtml = s.desc[lang] ? `<p class="desc">${s.desc[lang]}</p>` : '';

  if(single){
    const opt = s.options[0];
    return `
      <div class="service-card">
        <div class="service-info">
          <h4>${s.name[lang]}</h4>
          ${descHtml}
          ${notesHtml}
        </div>
        <div class="service-row-single">
          <div class="service-meta">
            <span>${formatDuration(opt.duration, lang)}</span>
            <span class="price">$${opt.price}</span>
          </div>
          <button class="add-btn ${isSelected(s.id,0)?'added':''}" data-single data-id="${s.id}" aria-label="${s.name[lang]}">
            ${isSelected(s.id,0) ? '✓' : '+'}
          </button>
        </div>
      </div>
    `;
  }

  return `
    <div class="service-card">
      <div class="service-info">
        <h4>${s.name[lang]}</h4>
        ${descHtml}
        ${notesHtml}
      </div>
      <div class="service-options">
        ${s.options.map((opt,i)=>`
          <div class="option-row" data-id="${s.id}" data-opt="${i}" style="cursor:pointer; ${isSelected(s.id,i)?'border-color:var(--beige);':''}">
            <span class="opt-label">${opt.label[lang]}</span>
            <span class="opt-meta">
              <span>${formatDuration(opt.duration, lang)}</span>
              <span class="price">$${opt.price}</span>
              <span class="add-btn ${isSelected(s.id,i)?'added':''}" style="width:32px;height:32px;font-size:1.1rem;">${isSelected(s.id,i)?'✓':'+'}</span>
            </span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* ---------------- SELECTION LOGIC ---------------- */
function toggleOption(serviceId, optIdx){
  if(isSelected(serviceId, optIdx)){
    selected = selected.filter(x => !(x.serviceId===serviceId && x.optionIndex===optIdx));
  } else {
    selected.push({serviceId, optionIndex:optIdx});
  }
  persistCart();
  renderServices();
  renderTicket();
}
function removeSelection(serviceId, optIdx){
  selected = selected.filter(x => !(x.serviceId===serviceId && x.optionIndex===optIdx));
  persistCart();
  renderServices();
  renderTicket();
}
function resolveSelected(){
  return selected
    .map(sel=>{
      const s = SERVICES.find(x=>x.id===sel.serviceId);
      const opt = s && s.options[sel.optionIndex];
      return (s && opt) ? { service:s, option:opt, serviceId:sel.serviceId, optionIndex:sel.optionIndex } : null;
    })
    .filter(Boolean);
}

/* ---------------- TICKET ---------------- */
function renderTicket(){
  const t = I18N[lang];
  const body = document.getElementById('ticketBody');
  const totalsEl = document.getElementById('ticketTotals');
  const scheduleBox = document.getElementById('scheduleBox');
  const countEl = document.getElementById('itemCount');

  countEl.textContent = `${selected.length} ${selected.length===1 ? t.itemWord : t.itemsWord}`;

  if(selected.length === 0){
    body.innerHTML = `<p class="ticket-empty">${t.ticketEmpty}</p>`;
    totalsEl.style.display = 'none';
    scheduleBox.style.display = 'none';
    return;
  }

  const items = resolveSelected();
  body.innerHTML = items.map(it => {
    const displayName = it.option.label ? `${it.service.name[lang]} — ${it.option.label[lang]}` : it.service.name[lang];
    return `
      <div class="ticket-item">
        <div>
          <div class="ti-name">${displayName}</div>
          <div class="ti-meta">${formatDuration(it.option.duration, lang)} · $${it.option.price}</div>
        </div>
        <button class="ti-remove" data-sid="${it.serviceId}" data-oidx="${it.optionIndex}" aria-label="remove">✕</button>
      </div>
    `;
  }).join('');

  body.querySelectorAll('.ti-remove').forEach(btn=>{
    btn.addEventListener('click', ()=> removeSelection(btn.dataset.sid, parseInt(btn.dataset.oidx,10)));
  });

  const totalDuration = items.reduce((sum,it)=>sum+it.option.duration,0);
  const totalPrice = items.reduce((sum,it)=>sum+it.option.price,0);
  document.getElementById('totalDuration').textContent = formatDuration(totalDuration, lang);
  document.getElementById('totalPrice').textContent = `$${totalPrice}`;
  totalsEl.style.display = 'block';
  scheduleBox.style.display = 'block';

  renderSlotsForDate(document.getElementById('apptDate').value);
  validateForm();
}

/* ---------------- CONFLICT-AWARE TIME SLOTS (2 workers, duration-aware) ---------------- */
function getTotalDuration(){
  return resolveSelected().reduce((sum,it)=>sum+it.option.duration, 0) || 30;
}

let slotsRequestId = 0;
async function renderSlotsForDate(date){
  const wrap = document.getElementById('timeSlots');
  const legend = document.getElementById('slotLegend');
  const hint = document.getElementById('pickDateFirst');

  if(!date){
    wrap.style.display = 'none';
    legend.style.display = 'none';
    hint.style.display = 'block';
    hint.textContent = I18N[lang].pickDateFirst;
    return;
  }

  const daySlots = getTimeSlotsForDate(date);
  if(daySlots.length === 0){
    wrap.style.display = 'none';
    legend.style.display = 'none';
    hint.style.display = 'block';
    hint.textContent = I18N[lang].closedThisDay;
    if(selectedTime){ selectedTime = null; persistCart(); }
    validateForm();
    return;
  }

  hint.style.display = 'none';
  wrap.style.display = 'flex';
  legend.style.display = 'flex';

  try{
    const duration = getTotalDuration();
    const closeMin = timeToMinutes(getBusinessHoursForDate(date).close);

    const requestId = ++slotsRequestId;
    const byWorker = await getOccupiedByWorker(date);
    if(requestId !== slotsRequestId) return; // a newer date was picked while this was loading

    const isBookable = (tm) => {
      const startMin = timeToMinutes(tm);
      if(startMin + duration > closeMin) return false;
      if(isPastSlot(date, tm)) return false;
      return findFreeWorker(byWorker, startMin, startMin + duration) > 0;
    };
    if(selectedTime && !isBookable(selectedTime)) selectedTime = null;

    wrap.innerHTML = daySlots.map(tm=>{
      const isTaken = !isBookable(tm);
      return `<button type="button" class="slot ${tm===selectedTime?'selected':''} ${isTaken?'taken':''}" ${isTaken?'disabled':''} data-time="${tm}">${formatSlotTime(tm, lang)}</button>`;
    }).join('');
  }catch(e){
    console.error('renderSlotsForDate failed:', e);
    wrap.style.display = 'none';
    legend.style.display = 'none';
    hint.style.display = 'block';
    hint.textContent = I18N[lang].slotsLoadError;
    return;
  }

  wrap.querySelectorAll('.slot:not(.taken)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedTime = btn.dataset.time;
      wrap.querySelectorAll('.slot').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      persistCart();
      validateForm();
    });
  });
  validateForm();
}

document.getElementById('apptDate').addEventListener('change', (e)=>{
  selectedTime = null;
  persistCart();
  renderSlotsForDate(e.target.value);
});

/* ---------------- FORM VALIDATION ---------------- */
function validateForm(){
  const date = document.getElementById('apptDate').value;
  const name = document.getElementById('clientName').value.trim();
  const email = document.getElementById('clientEmail').value.trim();
  const submitBtn = document.getElementById('submitBtn');
  const ok = selected.length > 0 && date && selectedTime && name && email;
  submitBtn.disabled = !ok;
}
['clientName','clientEmail','clientPhone'].forEach(id=>{
  document.getElementById(id).addEventListener('input', validateForm);
});

/* ---------------- SUBMIT BOOKING ---------------- */
document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const t = I18N[lang];
  const submitBtn = document.getElementById('submitBtn');
  const items = resolveSelected();
  const date = document.getElementById('apptDate').value;
  const name = document.getElementById('clientName').value.trim();
  const email = document.getElementById('clientEmail').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const dateStr = new Date(date+'T00:00').toLocaleDateString(lang==='fr' ? 'fr-CA' : 'en-US', {weekday:'long',month:'long',day:'numeric'});
  const serviceNames = items.map(it => it.option.label ? `${it.service.name[lang]} — ${it.option.label[lang]}` : it.service.name[lang]);
  const duration = items.reduce((sum,it)=>sum+it.option.duration, 0) || 30;

  submitBtn.disabled = true;

  if(isPastSlot(date, selectedTime)){
    alert(t.pastTimeError);
    submitBtn.disabled = false;
    renderSlotsForDate(date);
    return;
  }

  const startMin = timeToMinutes(selectedTime);
  const endMin = startMin + duration;
  const hours = getBusinessHoursForDate(date);
  if(!hours || endMin > timeToMinutes(hours.close)){
    alert(t.slotConflict);
    submitBtn.disabled = false;
    selectedTime = null;
    renderSlotsForDate(date);
    return;
  }

  // re-check right before writing, in case both workers were taken since the list last loaded
  const byWorker = await getOccupiedByWorker(date);
  const assignedWorker = findFreeWorker(byWorker, startMin, endMin);
  if(!assignedWorker){
    alert(t.slotConflict);
    submitBtn.disabled = false;
    selectedTime = null;
    renderSlotsForDate(date);
    return;
  }

  // persist booking so this slot shows as taken for every device — client and staff
  await Bookings.add({ name, email, phone, date, dateStr, time: selectedTime, duration, worker: assignedWorker, services: serviceNames, source:'client' });
  Cart.clear();

  document.getElementById('ticketBody').style.display='none';
  document.getElementById('ticketTotals').style.display='none';
  document.getElementById('scheduleBox').style.display='none';

  const confirmBox = document.getElementById('confirmBox');
  confirmBox.style.display = 'block';
  const notifyMsg = t.notifyStaffMsg(name, serviceNames.join(', '), dateStr, formatSlotTime(selectedTime, lang), phone);
  const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(notifyMsg)}`;
  const smsUrl = `sms:${PHONE_TEL}?body=${encodeURIComponent(notifyMsg)}`;
  const mailUrl = `mailto:${STUDIO_EMAIL}?subject=${encodeURIComponent('New booking — ' + name)}&body=${encodeURIComponent(notifyMsg)}`;
  confirmBox.innerHTML = `
    <div class="mark">✓</div>
    <h4>${t.confirmedTitle(name.split(' ')[0])}</h4>
    <p>${t.confirmedBody(items.length, dateStr, formatSlotTime(selectedTime, lang))}</p>
    <p class="ticket-note" style="margin-top:0;">${t.notifyStaffIntro}</p>
    <div class="contact-quick" style="justify-content:center; margin-bottom:18px;">
      <a class="quick-btn whatsapp" href="${waUrl}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 1.67c2.2 0 4.27.86 5.82 2.42a8.19 8.19 0 0 1 2.41 5.82c0 4.55-3.7 8.24-8.24 8.24a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.14.82.84-3.06-.2-.32a8.18 8.18 0 0 1-1.26-4.37c0-4.55 3.7-8.22 8.26-8.22M8.53 6.98c-.17 0-.45.06-.68.32-.23.25-.9.87-.9 2.13 0 1.25.92 2.46 1.05 2.63.13.17 1.8 2.88 4.43 3.93 2.19.87 2.64.7 3.11.65.48-.04 1.55-.63 1.77-1.24.22-.61.22-1.13.15-1.24-.06-.11-.24-.17-.5-.3-.26-.13-1.55-.77-1.79-.86-.24-.09-.42-.13-.59.13-.17.26-.68.86-.83 1.03-.15.17-.31.19-.57.06-.26-.13-1.09-.4-2.08-1.28-.77-.68-1.29-1.53-1.44-1.79-.15-.26-.02-.4.11-.53.12-.12.26-.31.39-.47.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.59-1.46-.82-1.99-.21-.5-.43-.44-.59-.45z"/></svg>
        ${t.notifyStaffBtn}
      </a>
      <a class="quick-btn call" href="${smsUrl}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        ${t.notifyTextBtn}
      </a>
      <a class="quick-btn call" href="${mailUrl}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        ${t.notifyEmailBtn}
      </a>
    </div>
    <p class="ticket-note">${t.depositReminderConfirm(STUDIO_EMAIL)}</p>
    <button class="btn-ghost" id="startOver" style="width:100%; margin-top:12px;">${t.startOver}</button>
  `;
  document.getElementById('startOver').addEventListener('click', ()=>{
    selected = [];
    selectedTime = null;
    document.getElementById('apptDate').value='';
    document.getElementById('clientName').value='';
    document.getElementById('clientEmail').value='';
    document.getElementById('clientPhone').value='';
    confirmBox.style.display='none';
    document.getElementById('ticketBody').style.display='block';
    renderServices();
    renderTicket();
  });
});

/* ---------------- CHECK APPOINTMENT MODAL ---------------- */
const modalOverlay = document.getElementById('checkModalOverlay');
function openModal(){
  modalOverlay.classList.add('open');
  document.getElementById('modalResult').style.display = 'none';
  document.getElementById('lookupEmail').value = '';
}
function closeModal(){ modalOverlay.classList.remove('open'); }
document.getElementById('checkApptNavBtn').addEventListener('click', openModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) closeModal(); });

async function runAppointmentLookup(){
  const t = I18N[lang];
  const email = document.getElementById('lookupEmail').value.trim().toLowerCase();
  const resultEl = document.getElementById('modalResult');
  resultEl.style.display = 'block';
  resultEl.innerHTML = `<p>${t.loadingSlots}</p>`;
  const bookings = await Bookings.all();
  const matches = bookings.filter(b => b.email && b.email.toLowerCase() === email);

  if(matches.length === 0){
    resultEl.innerHTML = `
      <p>${t.noResults}</p>
      <div class="modal-fallback">
        <p>${t.fallbackText}</p>
        <div class="contact-quick">
          <a class="quick-btn call" href="tel:${PHONE_TEL}">${t.callBtn}</a>
          <a class="quick-btn whatsapp" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_PRESET_MSG[lang])}" target="_blank" rel="noopener">${t.whatsappBtn}</a>
        </div>
      </div>
    `;
  } else {
    resultEl.innerHTML = `<p style="margin-bottom:10px;">${t.lookupResultFor(matches.length)}</p>` +
      matches.map(b => {
        const cancelled = b.status === 'cancelled';
        return `
        <div class="booking"${cancelled ? ' style="opacity:.6;"' : ''}>
          <div class="bk-date"${cancelled ? ' style="text-decoration:line-through;"' : ''}>${b.dateStr || b.date} · ${formatSlotTime(b.time, lang)} ${cancelled ? `<span class="cancelled-tag">(${t.cancelledLabel})</span>` : ''}</div>
          <div class="bk-services">${b.services.join(', ')}</div>
          ${!cancelled ? `<div class="bk-accept"><button class="cancel-btn" data-cancel-id="${b.id}">${t.cancelBookingBtn}</button></div>` : ''}
        </div>
      `;
      }).join('');

    resultEl.querySelectorAll('.cancel-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!confirm(t.clientCancelConfirm)) return;
        const reason = (prompt(t.clientCancelReasonPrompt) || '').trim() || '(not provided)';
        const bookingId = btn.dataset.cancelId;
        const b = matches.find(m=>m.id===bookingId);
        await Bookings.update(bookingId, {
          status: 'cancelled', cancelledBy: b ? b.name : '', cancelReason: reason,
          cancelledBySource: 'client', cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        runAppointmentLookup();
      });
    });
  }
}
document.getElementById('lookupBtn').addEventListener('click', runAppointmentLookup);

/* ---------------- CART DRAWER ---------------- */
const ticketDrawer = document.getElementById('ticket');
const drawerBackdrop = document.getElementById('drawerBackdrop');
window.toggleCartDrawer = function(forceOpen){
  const willOpen = typeof forceOpen === 'boolean' ? forceOpen : !ticketDrawer.classList.contains('open');
  ticketDrawer.classList.toggle('open', willOpen);
  drawerBackdrop.classList.toggle('open', willOpen);
};
document.getElementById('drawerClose').addEventListener('click', ()=> window.toggleCartDrawer(false));
drawerBackdrop.addEventListener('click', ()=> window.toggleCartDrawer(false));

/* ---------------- INIT ---------------- */
document.getElementById('apptDate').min = new Date().toISOString().split('T')[0];
if(savedCart.date) document.getElementById('apptDate').value = savedCart.date;
renderTabs();
renderServices();
renderTicket();
renderSlotsForDate(savedCart.date || '');
if(window.location.hash === '#book') window.toggleCartDrawer(true);
</script>
