<script>
const lang = initChrome();
const t = I18N[lang];

document.getElementById('pinInput').placeholder = t.pinPlaceholder;
document.getElementById('firebaseNotice').style.display = db ? 'none' : 'block';

/* Declared up front so the auto-unlock check below (which can call straight into
   initStaffPanel/renderDaySlots on page load) never references them before they exist. */
let staffPanelReady = false;
let staffSelectedDate = '';
let daySlotsRequestId = 0;

/* ---------------- PIN GATE ---------------- */
const pinGate = document.getElementById('pinGate');
const staffPanel = document.getElementById('staffPanel');

function unlockStaff(){
  pinGate.style.display = 'none';
  staffPanel.style.display = 'block';
  initStaffPanel();
}
function tryPin(){
  const val = document.getElementById('pinInput').value.trim();
  if(val === STAFF_PIN){
    sessionStorage.setItem('dmstyle_staff_ok', '1');
    unlockStaff();
  } else {
    document.getElementById('pinError').style.display = 'block';
  }
}
document.getElementById('pinSubmit').addEventListener('click', tryPin);
document.getElementById('pinInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryPin(); });

if(sessionStorage.getItem('dmstyle_staff_ok') === '1'){
  unlockStaff();
}

/* ---------------- CATALOG MANAGER ---------------- */
let catEditingId = null;
let catFormOptions = [{ label:'', duration:30, price:0 }];
let catFormImage = null;

function showCatImagePreview(dataUrl){
  const wrap = document.getElementById('catImagePreviewWrap');
  if(dataUrl){
    document.getElementById('catImagePreview').src = dataUrl;
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
  }
}

function renderCatalogOptionsForm(){
  const wrap = document.getElementById('catalogOptionsWrap');
  wrap.innerHTML = catFormOptions.map((opt, i) => `
    <div class="cat-option-row">
      <input type="text" class="cat-opt-label" data-idx="${i}" placeholder="${t.catalogOptLabelPlaceholder}" value="${opt.label || ''}">
      <input type="number" class="cat-opt-duration" data-idx="${i}" placeholder="${t.catalogOptDurationPlaceholder}" min="15" step="15" value="${opt.duration || ''}">
      <input type="number" class="cat-opt-price" data-idx="${i}" placeholder="${t.catalogOptPricePlaceholder}" min="0" step="5" value="${opt.price || ''}">
      <button type="button" class="cat-opt-remove" data-idx="${i}" aria-label="Remove">✕</button>
    </div>
  `).join('');

  wrap.querySelectorAll('.cat-opt-label').forEach(inp=> inp.addEventListener('input', e=> { catFormOptions[+e.target.dataset.idx].label = e.target.value; }));
  wrap.querySelectorAll('.cat-opt-duration').forEach(inp=> inp.addEventListener('input', e=> { catFormOptions[+e.target.dataset.idx].duration = parseInt(e.target.value,10) || 0; }));
  wrap.querySelectorAll('.cat-opt-price').forEach(inp=> inp.addEventListener('input', e=> { catFormOptions[+e.target.dataset.idx].price = parseFloat(e.target.value) || 0; }));
  wrap.querySelectorAll('.cat-opt-remove').forEach(btn=> btn.addEventListener('click', ()=>{
    if(catFormOptions.length <= 1) return; // always keep at least one row
    catFormOptions.splice(+btn.dataset.idx, 1);
    renderCatalogOptionsForm();
  }));
}

function resetCatalogForm(){
  catEditingId = null;
  catFormOptions = [{ label:'', duration:30, price:0 }];
  catFormImage = null;
  document.getElementById('catCategory').value = '';
  document.getElementById('catNameEn').value = '';
  document.getElementById('catNameFr').value = '';
  document.getElementById('catDescEn').value = '';
  document.getElementById('catDescFr').value = '';
  document.getElementById('catNotesEn').value = '';
  document.getElementById('catImageFile').value = '';
  document.getElementById('catImageStatus').style.display = 'none';
  showCatImagePreview(null);
  document.getElementById('catalogFormTitle').textContent = t.catalogAddTitle;
  document.getElementById('catCancelEdit').style.display = 'none';
  renderCatalogOptionsForm();
}

function startEditCatalogItem(id){
  const s = SERVICES.find(x=>x.id===id);
  if(!s) return;
  catEditingId = id;
  catFormOptions = s.options.map(o=>({ label: o.label ? o.label.en : '', duration:o.duration, price:o.price }));
  catFormImage = s.image || null;
  document.getElementById('catCategory').value = s.cat.en;
  document.getElementById('catNameEn').value = s.name.en;
  document.getElementById('catNameFr').value = (s.name.fr && s.name.fr !== s.name.en) ? s.name.fr : '';
  document.getElementById('catDescEn').value = s.desc.en || '';
  document.getElementById('catDescFr').value = (s.desc.fr && s.desc.fr !== s.desc.en) ? s.desc.fr : '';
  document.getElementById('catNotesEn').value = (s.notes.en || []).join('\n');
  document.getElementById('catImageFile').value = '';
  document.getElementById('catImageStatus').style.display = 'none';
  showCatImagePreview(catFormImage);
  document.getElementById('catalogFormTitle').textContent = t.catalogEditTitle;
  document.getElementById('catCancelEdit').style.display = 'inline-block';
  renderCatalogOptionsForm();
  document.getElementById('catalogForm').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderCatalogManager(){
  const cats = [...new Set(SERVICES.map(s=>s.cat.en))];
  document.getElementById('catalogCategoryList').innerHTML = cats.map(c=>`<option value="${c}">`).join('');

  const byCat = {};
  SERVICES.forEach(s=>{
    if(!byCat[s.cat.en]) byCat[s.cat.en] = [];
    byCat[s.cat.en].push(s);
  });

  const listEl = document.getElementById('catalogList');
  const catKeys = Object.keys(byCat);
  listEl.innerHTML = catKeys.length ? catKeys.map(cat => `
    <div class="cat-group">
      <div class="cat-group-title">${cat}</div>
      ${byCat[cat].map(s => `
        <div class="cat-item">
          <div class="cat-item-info" style="display:flex; gap:12px; align-items:flex-start;">
            ${s.image ? `<img src="${s.image}" class="cat-item-thumb" alt="">` : ''}
            <div>
              <div class="cat-item-name">${s.name.en}</div>
              <div class="cat-item-options">${s.options.map(o=> `${o.label ? o.label.en + ' — ' : ''}$${o.price} · ${formatDuration(o.duration, lang)}`).join('&nbsp;&nbsp;&nbsp;')}</div>
            </div>
          </div>
          <div class="cat-item-actions">
            <button class="accept-btn" data-edit-id="${s.id}">${t.catalogEditBtn}</button>
            <button class="cancel-btn" data-delete-id="${s.id}">${t.catalogDeleteBtn}</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('') : `<p class="ticket-note" style="text-align:left; margin:0 0 16px;">${t.catalogEmpty}</p>`;

  listEl.querySelectorAll('[data-edit-id]').forEach(btn=>{
    btn.addEventListener('click', ()=> startEditCatalogItem(btn.dataset.editId));
  });
  listEl.querySelectorAll('[data-delete-id]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(t.catalogDeleteConfirm)) return;
      try{
        await Catalog.remove(btn.dataset.deleteId);
        await loadCatalog();
        renderCatalogManager();
        document.getElementById('manService').innerHTML = buildManServiceOptions();
      }catch(e){
        console.error('Catalog.remove() failed:', e);
        alert(t.catalogSaveError);
      }
    });
  });

  resetCatalogForm();
}

/* ---------------- STAFF PANEL ---------------- */
function buildManServiceOptions(){
  const groups = categories(lang).map(cat=>{
    const items = SERVICES.filter(s=>s.cat[lang]===cat);
    const opts = items.flatMap(s=>{
      if(s.options.length===1 && !s.options[0].label){
        return [`<option value="${s.id}|0">${s.name[lang]} — $${s.options[0].price}</option>`];
      }
      return s.options.map((opt,i)=>`<option value="${s.id}|${i}">${s.name[lang]} — ${opt.label[lang]} — $${opt.price}</option>`);
    });
    return `<optgroup label="${cat}">${opts.join('')}</optgroup>`;
  }).join('');
  return `<option value="" disabled selected>${t.manServicePlaceholder}</option>` + groups;
}

function getManSelectedDuration(){
  const val = document.getElementById('manService').value;
  if(!val) return 30;
  const [svcId, optIdx] = val.split('|');
  const svc = SERVICES.find(s=>s.id===svcId);
  const opt = svc && svc.options[parseInt(optIdx,10)];
  return opt ? opt.duration : 30;
}

let manTimeRequestId = 0;
async function refreshManTimeOptions(){
  const manTimeSel = document.getElementById('manTime');
  const date = document.getElementById('manDate').value;
  const prevValue = manTimeSel.value;

  if(!date){
    manTimeSel.innerHTML = `<option value="" disabled selected>${t.pickStaffDate}</option>`;
    return;
  }

  const daySlots = getTimeSlotsForDate(date);
  if(daySlots.length === 0){
    manTimeSel.innerHTML = `<option value="" disabled selected>${t.closedThisDay}</option>`;
    return;
  }

  const duration = getManSelectedDuration();
  const closeMin = timeToMinutes(getBusinessHoursForDate(date).close);

  const requestId = ++manTimeRequestId;
  const byWorker = await getOccupiedByWorker(date);
  if(requestId !== manTimeRequestId) return; // a newer date was picked while this was loading

  const isBookable = (tm) => {
    const startMin = timeToMinutes(tm);
    if(startMin + duration > closeMin) return false;
    if(isPastSlot(date, tm)) return false;
    return findFreeWorker(byWorker, startMin, startMin + duration) > 0;
  };

  manTimeSel.innerHTML = daySlots.map(tm=>{
    const past = isPastSlot(date, tm);
    const bookable = isBookable(tm);
    const suffix = past ? ` ${t.manTimePastSuffix}` : (!bookable ? ` ${t.manTimeTakenSuffix}` : '');
    return `<option value="${tm}" ${!bookable?'disabled':''}>${formatSlotTime(tm, lang)}${suffix}</option>`;
  }).join('');
  if(prevValue && isBookable(prevValue)) manTimeSel.value = prevValue;
}

async function initStaffPanel(){
  if(staffPanelReady) return;
  staffPanelReady = true;

  await loadCatalog();
  renderCatalogManager();

  const today = new Date().toISOString().split('T')[0];
  document.getElementById('staffDate').min = today;
  document.getElementById('manDate').min = today;
  refreshManTimeOptions();
  document.getElementById('manService').innerHTML = buildManServiceOptions();

  document.getElementById('staffDate').addEventListener('change', (e)=>{
    staffSelectedDate = e.target.value;
    renderDaySlots();
  });

  document.getElementById('manDate').addEventListener('change', refreshManTimeOptions);
  document.getElementById('manService').addEventListener('change', refreshManTimeOptions);

  document.getElementById('catAddOption').addEventListener('click', ()=>{
    catFormOptions.push({ label:'', duration:30, price:0 });
    renderCatalogOptionsForm();
  });
  document.getElementById('catCancelEdit').addEventListener('click', resetCatalogForm);

  document.getElementById('catImageFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('catImageStatus');
    statusEl.style.display = 'block';
    statusEl.textContent = t.catalogImageProcessing;
    try{
      let dataUrl = await compressImageFile(file, 640, 0.7);
      if(dataUrl.length > MAX_IMAGE_DATA_LENGTH){
        dataUrl = await compressImageFile(file, 480, 0.55); // still too big — compress harder once
      }
      if(dataUrl.length > MAX_IMAGE_DATA_LENGTH){
        statusEl.textContent = t.catalogImageTooBig;
        e.target.value = '';
        return;
      }
      catFormImage = dataUrl;
      showCatImagePreview(dataUrl);
      statusEl.style.display = 'none';
    }catch(err){
      console.error('compressImageFile failed:', err);
      statusEl.textContent = t.catalogImageTooBig;
      e.target.value = '';
    }
  });
  document.getElementById('catImageRemove').addEventListener('click', ()=>{
    catFormImage = null;
    document.getElementById('catImageFile').value = '';
    document.getElementById('catImageStatus').style.display = 'none';
    showCatImagePreview(null);
  });
  document.getElementById('catSave').addEventListener('click', async ()=>{
    const catEn = document.getElementById('catCategory').value.trim();
    const nameEn = document.getElementById('catNameEn').value.trim();
    if(!catEn || !nameEn){ alert(t.catalogFillRequired); return; }
    const nameFr = document.getElementById('catNameFr').value.trim() || nameEn;
    const descEn = document.getElementById('catDescEn').value.trim();
    const descFr = document.getElementById('catDescFr').value.trim() || descEn;
    const notesEn = document.getElementById('catNotesEn').value.split('\n').map(x=>x.trim()).filter(Boolean);

    const options = catFormOptions
      .filter(o => o.duration > 0 && o.price >= 0)
      .map(o => ({
        label: o.label.trim() ? { en:o.label.trim(), fr:o.label.trim() } : null,
        duration: o.duration,
        price: o.price
      }));
    if(options.length === 0){ alert(t.catalogFillRequired); return; }

    const payload = {
      cat: { en:catEn, fr:catEn },
      name: { en:nameEn, fr:nameFr },
      desc: { en:descEn, fr:descFr },
      notes: { en:notesEn, fr:notesEn },
      options,
      image: catFormImage
    };

    const saveBtn = document.getElementById('catSave');
    saveBtn.disabled = true;
    try{
      if(catEditingId){
        await Catalog.update(catEditingId, payload);
      } else {
        await Catalog.add(payload);
      }
      await loadCatalog();
      renderCatalogManager();
      document.getElementById('manService').innerHTML = buildManServiceOptions();
      alert(t.catalogSaved);
    }catch(e){
      console.error('Catalog save failed:', e);
      alert(t.catalogSaveError);
    }finally{
      saveBtn.disabled = false;
    }
  });

  document.getElementById('manSubmit').addEventListener('click', async ()=>{
    const manSubmitBtn = document.getElementById('manSubmit');
    const name = document.getElementById('manName').value.trim();
    const phone = document.getElementById('manPhone').value.trim();
    const serviceVal = document.getElementById('manService').value;
    const date = document.getElementById('manDate').value;
    const time = document.getElementById('manTime').value;
    if(!name || !serviceVal || !date || !time){ alert(t.manFillRequired); return; }

    const [svcId, optIdx] = serviceVal.split('|');
    const svc = SERVICES.find(s=>s.id===svcId);
    const opt = svc.options[parseInt(optIdx,10)];
    const serviceLabel = opt.label ? `${svc.name[lang]} — ${opt.label[lang]}` : svc.name[lang];
    const duration = opt.duration;

    manSubmitBtn.disabled = true;

    if(isPastSlot(date, time)){
      alert(t.pastTimeError);
      manSubmitBtn.disabled = false;
      await refreshManTimeOptions();
      return;
    }

    const startMin = timeToMinutes(time);
    const endMin = startMin + duration;
    const hours = getBusinessHoursForDate(date);
    if(!hours || endMin > timeToMinutes(hours.close)){
      alert(t.slotConflict);
      manSubmitBtn.disabled = false;
      await refreshManTimeOptions();
      return;
    }

    // re-check right before writing, in case both workers were taken since the dropdown last loaded
    const byWorker = await getOccupiedByWorker(date);
    const assignedWorker = findFreeWorker(byWorker, startMin, endMin);
    if(!assignedWorker){
      alert(t.slotConflict);
      manSubmitBtn.disabled = false;
      await refreshManTimeOptions();
      return;
    }

    const dateStr = new Date(date+'T00:00').toLocaleDateString(lang==='fr' ? 'fr-CA' : 'en-US', {weekday:'long',month:'long',day:'numeric'});
    await Bookings.add({ name, phone, email:'', date, dateStr, time, duration, worker: assignedWorker, services:[serviceLabel], source:'staff' });
    manSubmitBtn.disabled = false;

    document.getElementById('manName').value = '';
    document.getElementById('manPhone').value = '';
    document.getElementById('manService').value = '';
    document.getElementById('manDate').value = '';
    refreshManTimeOptions();
    alert(t.manSuccess);
    if(date === staffSelectedDate) renderDaySlots();
  });
}

async function renderDaySlots(){
  const grid = document.getElementById('daySlotGrid');
  if(!staffSelectedDate){ grid.innerHTML = ''; return; }

  const requestId = ++daySlotsRequestId;
  grid.innerHTML = `<p class="ticket-note" style="text-align:left; margin:16px 0 0;">${t.loadingSlots}</p>`;

  const daySlots = getTimeSlotsForDate(staffSelectedDate);
  if(daySlots.length === 0){
    grid.innerHTML = `<p class="ticket-note" style="text-align:left; margin:16px 0 0;">${t.closedThisDay}</p>`;
    document.getElementById('dayBookingsWrap').style.display = 'none';
    document.getElementById('dayBookingsList').innerHTML = '';
    return;
  }

  let byWorker;
  try{
    byWorker = await getOccupiedByWorker(staffSelectedDate);
  }catch(e){
    console.error('getOccupiedByWorker failed for', staffSelectedDate, e);
    grid.innerHTML = `<p class="ticket-note" style="text-align:left; margin:16px 0 0; color:var(--warn);">${t.slotsLoadError}</p>`;
    return;
  }
  if(requestId !== daySlotsRequestId) return; // a newer date was picked while this was loading

  try{

  grid.innerHTML = daySlots.map(tm=>{
    const startMin = timeToMinutes(tm);
    const rows = [1,2].map(w=>{
      const covering = byWorker[w].find(iv => startMin >= iv.start && startMin < iv.end);
      let cls = 'open', status = t.slotAvailable, bookingId = '', blockId = '', title = '';
      if(covering){
        if(covering.type === 'booking'){
          cls = 'booked';
          status = (covering.ref.name || t.slotBooked) + (covering.ref.acceptedBy ? ' ✓' : '');
          bookingId = covering.ref.id;
          title = (covering.ref.services||[]).join(', ');
        } else {
          cls = 'blocked';
          status = t.slotBlocked + (covering.ref.lockedBy ? ` — ${covering.ref.lockedBy}` : '');
          blockId = covering.ref.id;
        }
      }
      return `<div class="worker-row ${cls}" data-time="${tm}" data-worker="${w}" data-booking-id="${bookingId}" data-block-id="${blockId}" title="${title}">
        <span class="w-label">${t.workerLabel(w)}</span><span class="w-status">${status}</span>
      </div>`;
    }).join('');
    return `<div class="day-slot"><div class="day-slot-time">${formatSlotTime(tm, lang)}</div>${rows}</div>`;
  }).join('');

  grid.querySelectorAll('.worker-row').forEach(el=>{
    el.addEventListener('click', ()=> onWorkerRowClick(el));
  });

  const listWrap = document.getElementById('dayBookingsWrap');
  const listEl = document.getElementById('dayBookingsList');
  const dayBookings = [...byWorker[1], ...byWorker[2]].filter(iv=>iv.type==='booking').map(iv=>iv.ref);
  const sortedBookings = dayBookings.slice().sort((a,b)=> (a.time||'').localeCompare(b.time||''));

  const allBookings = await Bookings.all();
  const cancelledToday = allBookings
    .filter(b => b.date === staffSelectedDate && b.status === 'cancelled')
    .sort((a,b)=> (a.time||'').localeCompare(b.time||''));

  if(sortedBookings.length === 0 && cancelledToday.length === 0){
    listWrap.style.display = 'none';
    listEl.innerHTML = '';
  } else {
    listWrap.style.display = 'block';
    listEl.innerHTML = sortedBookings.map(b => `
      <div class="booking">
        <div class="bk-date">${formatSlotTime(b.time, lang)} — ${b.name} <span style="color:var(--text-muted); font-weight:400;">(${t.workerLabel(b.worker||1)})</span></div>
        <div class="bk-services">${(b.services||[]).join(', ')}${b.phone ? ' · ' + b.phone : ''}</div>
        <div class="bk-accept">${
          b.acceptedBy
            ? `<span class="accepted-tag">${t.acceptedByPrefix} ${b.acceptedBy}</span>`
            : `<button class="accept-btn" data-booking-id="${b.id}">${t.acceptBookingBtn}</button>`
        }</div>
      </div>
    `).join('') + cancelledToday.map(b => `
      <div class="booking" style="opacity:.6;">
        <div class="bk-date" style="text-decoration:line-through;">${formatSlotTime(b.time, lang)} — ${b.name}</div>
        <div class="bk-services">${(b.services||[]).join(', ')}</div>
        <div class="bk-accept"><span class="cancelled-tag">${t.cancelledLabel}${b.cancelledBy ? ' — ' + b.cancelledBy : ''}${b.cancelReason ? ': ' + b.cancelReason : ''}</span></div>
      </div>
    `).join('');
    listEl.querySelectorAll('.accept-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const acceptName = (prompt(t.acceptNamePrompt) || '').trim();
        if(!acceptName) return;
        await Bookings.update(btn.dataset.bookingId, { acceptedBy: acceptName });
        renderDaySlots();
      });
    });
  }
  }catch(e){
    console.error('renderDaySlots failed for', staffSelectedDate, e);
    grid.innerHTML = `<p class="ticket-note" style="text-align:left; margin:16px 0 0; color:var(--warn);">${t.slotsLoadError}</p>`;
  }
}

async function onWorkerRowClick(el){
  const worker = parseInt(el.dataset.worker, 10);
  if(el.classList.contains('open')){
    const lockedBy = (prompt(t.lockNamePrompt) || '').trim();
    if(!lockedBy) return; // cancelled or left blank — don't lock
    await Blocked.add({ date: staffSelectedDate, time: el.dataset.time, worker, duration: 30, lockedBy });
    renderDaySlots();
  } else if(el.classList.contains('blocked')){
    if(el.dataset.blockId) await Blocked.remove(el.dataset.blockId);
    renderDaySlots();
  } else if(el.classList.contains('booked')){
    if(!el.dataset.bookingId) return;
    const cancelledBy = (prompt(t.cancelNamePrompt) || '').trim();
    if(!cancelledBy) return; // cancelled or left blank — don't cancel
    const cancelReason = (prompt(t.cancelReasonPrompt) || '').trim();
    if(!cancelReason) return; // cancelled or left blank — don't cancel
    await Bookings.update(el.dataset.bookingId, {
      status: 'cancelled', cancelledBy, cancelReason,
      cancelledBySource: 'staff', cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    renderDaySlots();
  }
}
</script>
